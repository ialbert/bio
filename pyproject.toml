[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "bio"
description = "Command-line utilities to make bioinformatics explorations more enjoyable"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = []
dynamic = ["version"]

authors = [
  { name = "Istvan Albert", email = "istvan.albert@gmail.com" },
]

classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

dependencies = [
        'biopython >= 1.80',
        'requests',
        'tqdm',
        'mygene',
        'pandas',
        'pooch',
        'click',
        'gprofiler-official'
]

[project.scripts]
"bio1" = "biorun.__main__:run"
"bio" = "biorun.cli:cli"
"fasta_filter.py" = "biorun.scripts.fasta_filter:run"

[project.urls]
Documentation = "https://github.com/ialbert/bio#readme"
Issues = "https://github.com/ialbert/bio/issues"
Source = "https://github.com/ialbert/bio/"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["biorun", "biorun.api", "biorun.libs", "biorun.scripts", "biorun.tests"]
include-package-data = true

[tool.setuptools.package-data]
"biorun.data" = ["*.*"]

[tool.setuptools.dynamic]
version = {attr = "biorun.__about__.__version__"}

